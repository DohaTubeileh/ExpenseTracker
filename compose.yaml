version: "3.8"

services:
  # NestJS Application Service
  api:
    build:
      context: .
      target: development
    container_name: nestjs_api
    command: sh -c "npx prisma generate && npx prisma migrate dev --name auto_migration && npm run start:dev"
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_DATABASE}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: nestjs_postgres
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
